[package]
name = "aegis-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Aegis — AI cost optimization gateway"

[dependencies]
# HTTP server
axum = { version = "0.8", features = ["macros", "json"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "request-id", "timeout"] }
hyper = { version = "1", features = ["full"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"

# HTTP client
url = "2"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Storage
sqlx = { version = "0.8", default-features = false, features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls",
  "uuid",
  "chrono",
  "json",
  "migrate",
  "macros",
] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "script"] }

# Crypto & hashing
argon2 = "0.5"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
# RS256 JWT signing for Vertex AI service-account auth. See docs/adr/0007. Used only by
# providers/vertex.rs — no other provider needs asymmetric signing.
jsonwebtoken = "9"
hkdf = "0.12"
aes-gcm = "0.10"
rand = "0.8"
subtle = "2"
base64 = "0.22"
hex = "0.4"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
thiserror = "2"
anyhow = "1"
lru = "0.12"
dashmap = "6"
once_cell = "1"
regex = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[lib]
name = "aegis_gateway"
path = "src/lib.rs"

[[bin]]
name = "aegis-gateway"
path = "src/main.rs"
